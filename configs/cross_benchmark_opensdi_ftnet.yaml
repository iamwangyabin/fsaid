name: cross_benchmark_opensdi_ftnet
output_dir: outputs/cross_benchmark/opensdi/ftnet

protocol:
  manifest: data/manifests/cross_benchmark/opensdi.csv
  stages: [SD1.5, SD2.1, SDXL, SD3, FLUX.1]
  shots: [1, 5, 10]
  seeds: [0, 1, 2]
  query_per_class: null
  cumulative_cache: false
  evaluation_scope: current
  source_generators: []

methods:
  ftnet:
    device: cuda:0
    backbone: ViT-L/14
    clip_layer: 12
    alpha: 15.0
    batch_size: 64
  ftnet_t:
    device: cuda:0
    backbone: ViT-L/14
    clip_layer: 12
    alpha: 15.0
    epochs: 20
    learning_rate: 0.001
    batch_size: 32
    num_workers: 4
