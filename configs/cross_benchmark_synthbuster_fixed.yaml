name: cross_benchmark_synthbuster_fixed
output_dir: outputs/cross_benchmark/synthbuster/fixed

protocol:
  manifest: data/manifests/cross_benchmark/synthbuster.csv
  stages: [DALL-E 2, DALL-E 3, Midjourney v5, Adobe Firefly]
  shots: [0]
  seeds: [0]
  query_per_class: null
  episode_mode: joint
  cumulative_cache: false
  evaluation_scope: current
  source_generators: []

methods:
  clipdet:
    checkpoint: checkpoints/clipdet/clipdet_latent10k_plus.pth
    backbone_checkpoint: checkpoints/backbones/open_clip_pytorch_model.bin
    device: cuda:0
    batch_size: 32
  omnidfa_detection:
    checkpoint: checkpoints/omnidfa/OmniDFA_zero_shot_epoch40.pth
    device: cuda:0
    dtype: bfloat16
    batch_size: 64
    seed: 0
