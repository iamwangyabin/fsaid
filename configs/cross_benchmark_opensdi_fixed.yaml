name: cross_benchmark_opensdi_fixed
output_dir: outputs/cross_benchmark/opensdi/fixed

protocol:
  manifest: data/manifests/cross_benchmark/opensdi.csv
  stages: [SD1.5, SD2.1, SDXL, SD3, FLUX.1]
  shots: [0]
  seeds: [0]
  query_per_class: null
  episode_mode: joint
  cumulative_cache: false
  evaluation_scope: current
  source_generators: []

methods:
  clipdet:
    checkpoint: checkpoints/clipdet/clipdet_latent10k_plus.pth
    backbone_checkpoint: checkpoints/backbones/open_clip_pytorch_model.bin
    device: cuda:0
    batch_size: 32
  # The released training list contains FLUX_Dev; this is a cross-dataset
  # diagnostic, not a claim that all five generators are strictly unseen.
  omnidfa_detection:
    checkpoint: checkpoints/omnidfa/OmniDFA_zero_shot_epoch40.pth
    device: cuda:0
    dtype: bfloat16
    batch_size: 64
    seed: 0
