[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fewshot-aigc-benchmark"
version = "0.4.0"
description = "Reproducible few-shot AI-generated image detection benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
methods = [
  "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6",
  "dill",
  "einops",
  "ftfy",
  "huggingface-hub",
  "matplotlib",
  "open-clip-torch",
  "regex",
  "setuptools",
  "timm",
  "torch>=2.5,<2.7",
  "torchmetrics",
  "torchvision>=0.20,<0.22",
  "tqdm",
]
data = ["pyarrow>=16"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aigcd = "run:main"

[tool.setuptools]
py-modules = [
  "run",
  "config",
  "data",
  "genimage_arrow",
  "models",
  "utils",
  "train_fsd",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["methods*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
